name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SAVE_CACHE: ${{ github.ref == 'refs/heads/master' }}

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check
      - name: Check formatting of the query crate
        run: cargo fmt --check
        working-directory: query

  query:
    name: Query
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: query
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: query
          shared-key: query
          save-if: ${{ env.SAVE_CACHE }}

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run Clippy on the WASM bindings
        run: cargo clippy --lib --features wasm --target wasm32-unknown-unknown -- -D warnings
      - name: Run tests
        run: cargo test

  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5

      - name: Install the Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mold

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          shared-key: server
          save-if: ${{ env.SAVE_CACHE }}

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test
      - name: Build
        run: cargo build

  client:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: query
          shared-key: client
          save-if: ${{ env.SAVE_CACHE }}
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build

  licenses:
    name: Licenses
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          shared-key: licenses
          cache-targets: false
          cache-directories: ~/.cargo/advisory-dbs
          save-if: ${{ env.SAVE_CACHE }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check the licenses of the dependency graph
        run: cargo deny check licenses
      - name: Check the dependency graph for advisories
        run: cargo deny check advisories
