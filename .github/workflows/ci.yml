name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SAVE_CACHE: ${{ github.ref == 'refs/heads/master' }}

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check
      - name: Check formatting of the query crate
        run: cargo fmt --check
        working-directory: query

  query:
    name: Query
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: query
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: query
          shared-key: query
          save-if: ${{ env.SAVE_CACHE }}

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run Clippy on the WASM bindings
        run: cargo clippy --lib --features wasm --target wasm32-unknown-unknown -- -D warnings
      - name: Run tests
        run: cargo test

  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5

      - name: Install the Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mold

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          shared-key: server
          save-if: ${{ env.SAVE_CACHE }}

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test
      - name: Build
        run: cargo build

  client:
    name: Client
    runs-on: ubuntu-latest
    env:
      VOSK_MODEL_EN: vosk-model-small-en-us-0.15
      VOSK_MODEL_JA: vosk-model-small-ja-0.22
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: query
          shared-key: client
          save-if: ${{ env.SAVE_CACHE }}
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run check

      - name: Cache the speech model vocabularies
        id: vosk-words
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vosk-words
          key: vosk-words-${{ env.VOSK_MODEL_EN }}-${{ env.VOSK_MODEL_JA }}
      - name: Fetch the speech model vocabularies
        if: steps.vosk-words.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/vosk-words"
          for model in "$VOSK_MODEL_EN" "$VOSK_MODEL_JA"; do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$model.zip" "https://alphacephei.com/vosk/models/$model.zip"
            out="$RUNNER_TEMP/vosk-words/$model"
            unzip -p "$RUNNER_TEMP/$model.zip" '*/graph/words.txt' > "$out" ||
              unzip -p "$RUNNER_TEMP/$model.zip" '*/graph/Gr.fst' > "$out"
            test -s "$out"
          done

      - run: pnpm test
        env:
          VOSK_WORDS_EN: ${{ runner.temp }}/vosk-words/${{ env.VOSK_MODEL_EN }}
          VOSK_WORDS_JA: ${{ runner.temp }}/vosk-words/${{ env.VOSK_MODEL_JA }}
      - run: pnpm run build

  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - name: Install the Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          shared-key: desktop
          save-if: ${{ env.SAVE_CACHE }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm run build

      - name: Check formatting
        run: cargo fmt --check
        working-directory: desktop/src-tauri
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: desktop/src-tauri
      - name: Run tests
        run: cargo test
        working-directory: desktop/src-tauri

  licenses:
    name: Licenses
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          shared-key: licenses
          cache-targets: false
          cache-directories: ~/.cargo/advisory-dbs
          save-if: ${{ env.SAVE_CACHE }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check the licenses of the dependency graph
        run: cargo deny check licenses
      - name: Check the dependency graph for advisories
        run: cargo deny check advisories
