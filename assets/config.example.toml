# Example configuration for jl1his-logger. The server and the CLI read
# config.toml in the working directory, or the file given with -c/--config.
# Relative paths are relative to the directory this file is in.

[server]
# Address to listen on; serve --listen overrides it. Put a TLS-terminating
# reverse proxy in front: passkeys only work over HTTPS (or on http://localhost).
listen = "127.0.0.1:8080"
# URL the app is reached at, with a DNS hostname. Passkeys are bound to its host,
# so do not change it later. serve, setup and user invite need it.
public_origin = "https://log.example.com"
# The built web app (cd client && pnpm run build); serve --web-dir overrides it.
# Without it only the API runs.
# web_dir = "../../client/build"
# Apply pending migrations when serve starts. Set to false to require the
# migrate subcommand.
auto_migrate = true

[database]
# The one SQLite database (QSOs, stations, logbooks, users, passkeys, tokens).
# Migration snapshots and backups go to the snapshots and backups directories
# next to it.
path = "jl1his-logger.db"

[reference]
# The CTY zip archive (Big CTY or the contest files from country-files.com)
# whose cty.dat and cty.csv lookup and callsign resolution use; installed by an
# admin with the CLI or from the web app.
cty = "reference/cty.zip"

[adif]
# Length counting for exported ADI: "codepoints" (default) or "bytes".
length = "codepoints"
