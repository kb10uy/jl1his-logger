[package]
name = "jl1his-logger"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
adif-reader = { git = "https://github.com/kb10uy/adif-reader", version = "0.1.1" }
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
callfind = { git = "https://github.com/kb10uy/callfind", version = "0.1.0" }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
cookie = "0.18.2"
dotenvy = "0.15.7"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
hyper = { version = "1.12.0", default-features = false, features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["server-auto", "server-graceful", "tokio"] }
jl1his-query = { path = "../query" }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs"] }
toml = "1.1.8"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v7"] }
webauthn-rs = { version = "=0.6.1-dev", features = ["conditional-ui"] }

[dev-dependencies]
base64 = "0.22.1"
http-body-util = "0.1.5"
p256 = { version = "0.13.2", features = ["ecdsa"] }
rstest = "0.28.0"
serde_cbor_2 = "0.13.0"
tempfile = "3.27.0"
