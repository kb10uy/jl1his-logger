[package]
name = "jl1his-logger"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
toml = "1.1.8"
url = "2.5.8"

[dev-dependencies]
rstest = "0.28.0"
tempfile = "3.27.0"
