[package]
name = "jl1his-logger-desktop"
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "charset", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time"] }
toml = "1.1.8"
url = "2.5.8"

[dev-dependencies]
rstest = "0.26.1"
tempfile = "3.27.0"
