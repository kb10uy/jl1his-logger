[package]
name = "jl1his-logger-desktop"
version = "0.6.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
adif-manip = { git = "https://github.com/kb10uy/adif-manip", version = "0.3.0" }
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "charset", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.4"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time"] }
toml = "1.1.8"
url = "2.5.8"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(windows))'.dependencies]
tauri-plugin-notification = "2.7.0"

[dev-dependencies]
rstest = "0.26.1"
tempfile = "3.27.0"
